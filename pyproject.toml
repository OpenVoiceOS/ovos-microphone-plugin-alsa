[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos_microphone_plugin_alsa"
dynamic = ["version"]
description = "A alsa microphone implementation for OVOS"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "JarbasAi", email = "jarbasai@mailfence.com"},
]
keywords = ["ovos", "plugin", "listener", "microphone", "alsa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Linguistic",
    "Programming Language :: Python :: 2",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.0",
    "Programming Language :: Python :: 3.1",
    "Programming Language :: Python :: 3.2",
    "Programming Language :: Python :: 3.3",
    "Programming Language :: Python :: 3.4",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
]
dependencies = [
    "ovos-plugin-manager>=2.1.0,<3.0.0",
    "pyalsaaudio",
]

[project.optional-dependencies]
test = []

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-microphone-plugin-alsa"

[project.entry-points."opm.microphone"]
ovos-microphone-plugin-alsa = "ovos_microphone_plugin_alsa:AlsaMicrophone"

[tool.setuptools.dynamic]
version = {attr = "ovos_microphone_plugin_alsa.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_microphone_plugin_alsa*"]
